<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fotos — Eventos Litoral</title>
<link rel="icon" href="LOGO.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Marcellus&family=Big+Shoulders+Display:wght@400;700;900&family=Cormorant+Garamond:wght@300;400;500;600&family=Playfair+Display:wght@400;500;700&family=Manrope:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;700&family=Space+Grotesk:wght@300;400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg: #0a0a0a;
    --bg-2: #111111;
    --bg-3: #171717;
    --line: rgba(255,255,255,.08);
    --ink: #f5f1e8;
    --ink-dim: rgba(245,241,232,.62);
    --ink-mute: rgba(245,241,232,.38);
    --gold: #d4af37;
    --gold-soft: rgba(212,175,55,.18);

    --font-display: 'Big Shoulders Display', sans-serif;
    --font-body: 'Space Grotesk', sans-serif;
    --display-weight: 900;
    --display-tracking: -0.01em;
    --display-line: 0.9;
    --radius-card: 0px;
  }

  *, *::before, *::after { box-sizing: border-box }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }

  a { color: inherit; text-decoration: none }
  button { font-family: inherit }
  ul, li { list-style: none; margin: 0; padding: 0 }

  .container { max-width: 1280px; margin: 0 auto; padding: 0 32px }
  @media (max-width: 720px) { .container { padding: 0 20px } }

  .display {
    font-family: var(--font-display);
    font-weight: var(--display-weight);
    letter-spacing: var(--display-tracking);
    line-height: var(--display-line);
    text-transform: uppercase;
  }

  .eyebrow {
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .eyebrow .dot {
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--gold);
    vertical-align: middle;
    margin-right: 10px;
    margin-bottom: 2px;
  }

  .hairline { height: 1px; background: var(--line); width: 100% }

  /* ── NAV ── */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    backdrop-filter: blur(12px);
    background: rgba(10,10,10,.55);
    border-bottom: 1px solid var(--line);
  }
  .nav-inner {
    display: flex; align-items: center; justify-content: space-between;
    height: 68px; max-width: 1280px; margin: 0 auto; padding: 0 32px; gap: 24px;
  }
  .nav-logo { height: 62px; width: auto; display: block }
  .nav-links {
    display: flex; gap: 36px;
    font-size: 12.5px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--ink-dim);
  }
  .nav-links a:hover { color: var(--gold) }
  .nav-cta {
    font-size: 11.5px; letter-spacing: .18em; text-transform: uppercase;
    color: #0a0a0a; background: var(--gold);
    padding: 11px 20px; border: 0; cursor: pointer; border-radius: 2px;
    font-weight: 600; transition: transform .2s;
  }
  .nav-cta:hover { transform: translateY(-1px) }
  @media (max-width: 880px) {
    .nav-links { display: none }
    .nav-inner { padding: 0 20px }
  }

  /* ── PAGE HEADER ── */
  .fotos-header {
    padding: 140px 0 72px;
    border-bottom: 1px solid var(--line);
    background: radial-gradient(ellipse 70% 60% at 50% 0%, rgba(212,175,55,.07), transparent 60%);
  }
  .fotos-header-inner {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 40px;
    flex-wrap: wrap;
  }
  .fotos-title {
    font-size: clamp(52px, 9vw, 130px);
    margin: 18px 0 0;
  }
  .fotos-title em { font-style: normal; color: var(--gold) }
  .fotos-total {
    font-family: var(--font-display);
    font-weight: var(--display-weight);
    font-size: clamp(48px, 7vw, 96px);
    color: var(--gold);
    line-height: 1;
    display: block;
    text-transform: uppercase;
  }
  .fotos-header-meta {
    text-align: right;
    padding-bottom: 8px;
  }

  /* ── INTERACTIVE LIST ── */
  .il-wrapper {
    position: relative;
    padding: 0 0 120px;
    cursor: none;
  }
  @media (max-width: 880px) { .il-wrapper { cursor: auto } }

  .il-list { padding: 0 }

  .il-item {
    display: flex;
    align-items: center;
    gap: 28px;
    padding: 30px 0;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: padding-left .4s cubic-bezier(.16,1,.3,1);
    position: relative;
    overflow: hidden;
  }
  .il-item::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--gold-soft);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .5s cubic-bezier(.16,1,.3,1);
    z-index: 0;
  }
  .il-item--active::before { transform: scaleX(1) }
  .il-item--active { padding-left: 16px }

  .il-item > * { position: relative; z-index: 1 }

  .il-num {
    font-size: 11px;
    letter-spacing: .2em;
    color: var(--ink-mute);
    flex-shrink: 0;
    width: 28px;
    transition: color .3s;
  }
  .il-item--active .il-num { color: var(--gold) }

  .il-title {
    font-family: var(--font-display);
    font-weight: var(--display-weight);
    font-size: clamp(28px, 4.5vw, 68px);
    line-height: 1;
    letter-spacing: var(--display-tracking);
    text-transform: uppercase;
    flex: 0 0 auto;
    transition: color .25s;
  }
  .il-item--active .il-title { color: var(--gold) }
  .il-item--dim .il-title { color: var(--ink-mute) }

  .il-rule {
    flex: 1;
    height: 1px;
    background: var(--line);
    transition: background .3s;
  }
  .il-item--active .il-rule { background: rgba(212,175,55,.35) }
  .il-item--dim .il-rule { opacity: .3 }

  .il-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink-mute);
    flex-shrink: 0;
    transition: color .3s;
  }
  .il-item--active .il-meta { color: var(--ink-dim) }
  .il-item--dim .il-meta { opacity: .3 }
  .il-cat { color: inherit }
  .il-sep { opacity: .4 }
  .il-year { color: var(--gold); opacity: .7 }
  .il-count { color: inherit }

  .il-arrow {
    font-size: 18px;
    color: var(--gold);
    flex-shrink: 0;
    opacity: 0;
    transform: translateX(-8px);
    transition: opacity .3s, transform .3s;
  }
  .il-item--active .il-arrow { opacity: 1; transform: translateX(0) }

  @media (max-width: 720px) {
    .il-meta { display: none }
    .il-num { display: none }
    .il-title { font-size: clamp(22px, 7vw, 40px) }
    .il-item { padding: 20px 0 }
  }

  /* ── CURSOR FLOATING IMAGE ── */
  .il-cursor-img {
    position: fixed;
    top: 0; left: 0;
    width: 340px;
    height: 430px;
    pointer-events: none;
    z-index: 40;
    border-radius: 2px;
    overflow: hidden;
    margin-left: 24px;
    margin-top: -215px;
    box-shadow: 0 32px 80px rgba(0,0,0,.7);
    transition: opacity .35s ease, transform .1s ease;
  }
  .il-cursor-img-item {
    position: absolute;
    inset: 0;
  }
  @media (max-width: 880px) { .il-cursor-img { display: none } }

  /* ── FOOTER ── */
  footer { padding: 60px 0 32px; border-top: 1px solid var(--line); background: #050505 }
  .ft { display: flex; justify-content: space-between; gap: 32px; flex-wrap: wrap; align-items: flex-end }
  .ft-logo { height: 44px; width: auto; opacity: .85 }
  .ft-meta { color: var(--ink-mute); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; line-height: 2 }

  /* image-slot placeholder style */
  image-slot { background: repeating-linear-gradient(135deg, #141414 0 12px, #0e0e0e 12px 24px) !important }

  /* ── LIGHTBOX OVERLAY ── */
  .lb-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(5,5,5,.96);
    backdrop-filter: blur(6px);
    display: flex; align-items: flex-start; justify-content: center;
    overflow-y: auto;
    padding: 60px 20px 60px;
  }
  .lb-inner {
    width: 100%; max-width: 1100px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 2px;
  }

  /* header */
  .lb-header {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 24px;
    padding: 36px 40px 28px;
    border-bottom: 1px solid var(--line);
  }
  .lb-title { font-size: clamp(28px, 5vw, 52px); margin: 0 }
  .lb-close-btn {
    background: transparent; border: 1px solid var(--line);
    color: var(--ink-dim); font-size: 18px; cursor: pointer;
    width: 42px; height: 42px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: color .2s, border-color .2s;
  }
  .lb-close-btn:hover { color: var(--gold); border-color: var(--gold) }

  /* photo grid */
  .lb-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 3px;
    padding: 3px;
  }
  @media (max-width: 720px) { .lb-grid { grid-template-columns: repeat(2, 1fr) } }
  @media (max-width: 420px) { .lb-grid { grid-template-columns: 1fr } }

  .lb-cell {
    position: relative; cursor: pointer;
    aspect-ratio: 1;
    overflow: hidden;
    background: repeating-linear-gradient(135deg, #141414 0 12px, #0e0e0e 12px 24px);
  }
  .lb-cell-img {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform .5s cubic-bezier(.16,1,.3,1);
  }
  .lb-cell:hover .lb-cell-img { transform: scale(1.06) }
  .lb-cell-hover {
    position: absolute; inset: 0;
    background: rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: var(--gold);
    opacity: 0; transition: opacity .3s;
  }
  .lb-cell:hover .lb-cell-hover { opacity: 1 }

  /* empty state */
  .lb-empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 80px 40px;
    color: var(--ink-mute); font-size: 14px; letter-spacing: .1em; text-align: center;
    gap: 0;
  }

  /* ── PHOTO VIEWER (fullscreen) ── */
  .lb-viewer {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(0,0,0,.96);
    display: flex; align-items: center; justify-content: center;
  }
  .lb-viewer-close {
    position: absolute; top: 24px; right: 28px;
    background: transparent; border: 1px solid rgba(255,255,255,.18);
    color: var(--ink-dim); font-size: 20px; cursor: pointer;
    width: 46px; height: 46px;
    display: flex; align-items: center; justify-content: center;
    transition: color .2s, border-color .2s; z-index: 1;
  }
  .lb-viewer-close:hover { color: var(--gold); border-color: var(--gold) }

  .lb-viewer-img-wrap {
    max-width: 90vw; max-height: 90vh;
    display: flex; align-items: center; justify-content: center;
  }
  .lb-viewer-img {
    max-width: 100%; max-height: 90vh;
    object-fit: contain;
    box-shadow: 0 24px 80px rgba(0,0,0,.8);
  }

  .lb-viewer-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
    color: var(--ink); font-size: 32px; cursor: pointer;
    width: 54px; height: 80px;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, color .2s;
  }
  .lb-viewer-nav:hover { background: var(--gold-soft); color: var(--gold) }
  .lb-viewer-prev { left: 20px }
  .lb-viewer-next { right: 20px }

  .lb-viewer-counter {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    font-size: 11px; letter-spacing: .2em; text-transform: uppercase;
    color: var(--ink-mute);
  }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="image-slot.js"></script>
<script type="text/babel" src="src/fotos.jsx"></script>
<script type="text/babel">
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<FotosPage />);
</script>

</body>
</html>
